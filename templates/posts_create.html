{% extends "base.html" %} {% block content %}

<h1>نوشتن مطلب تازه</h1>
<form
  method="POST"
  action="{{ url_for('posts_create') }}"
  class="post-composer-form"
>
  <div class="post-form-field">
    <label for="post-title">عنوان مطلب</label>
    <input type="text" id="post-title" name="title" required />
  </div>

  <div class="post-form-field">
    <label for="post-content">متن مطلب</label>
    <textarea
      id="post-content"
      name="content"
      rows="8"
      required
      placeholder="متن مطلب‌تان را اینجا بنویسید..."
    ></textarea>
  </div>

  <div class="post-form-field">
    <label for="tags">برچسب‌ها (با کاما یا فاصله جدا کنید)</label>
    <input
      type="text"
      id="tags"
      name="tags"
      placeholder="flask, python web-dev"
    />
  </div>

  <button type="submit">ثبت</button>
</form>

{% endblock %}
