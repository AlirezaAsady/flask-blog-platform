{% extends "base.html" %} {% block content %}
<h1>لیست کاربران</h1>

{% if users %}
<table>
  <thead>
    <tr>
      <th>شناسه</th>
      <th>نام</th>
      <th>نام_خانوادگی</th>
      <th>سن</th>
    </tr>
  </thead>
  <tbody>
    {% for user in users %}
    <tr>
      <td>{{ user.id }}</td>
      <td>{{ user.firstname }}</td>
      <td>{{ user.lastname }}</td>
      <td>{{ user.age }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endif %} {% endblock %}
